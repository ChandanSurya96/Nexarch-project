# Continuous integration (ADR-040).
#
# development-guide.md has claimed since Phase 0 that "PRs require passing CI
# (lint, tests) before merge" — nothing enforced it, because no CI existed.
# This is that gate.
#
# Backend and frontend run as independent jobs so a frontend-only change
# isn't blocked on Postgres spinning up, and a failure names which side broke
# without reading logs.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the previous run — no value in finishing
# CI for a commit that's already been superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, migrate, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: nexarch
          POSTGRES_PASSWORD: nexarch
          POSTGRES_DB: nexarch_test
        ports: ["5432:5432"]
        # Without a healthcheck the job races the container and fails
        # intermittently on connection-refused.
        options: >-
          --health-cmd "pg_isready -U nexarch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Test-only values. Real secrets are never needed by CI: the suite runs
      # against TestingConfig, and config_validation only gates production.
      DATABASE_URL: postgresql://nexarch:nexarch@localhost:5432/nexarch_test
      TEST_DATABASE_URL: postgresql://nexarch:nexarch@localhost:5432/nexarch_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-not-used-outside-github-actions
      ENCRYPTION_KMS_KEY_ID: ci-only-encryption-secret-not-used-elsewhere
      FLASK_ENV: testing
      FLASK_APP: wsgi.py

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app/ tests/

      - name: Format check (black)
        run: black --check app/ tests/

      - name: Apply migrations
        # Runs against real Postgres, so a migration that only works on SQLite
        # (or doesn't apply cleanly from scratch) fails here rather than at
        # deploy time.
        run: flask db upgrade

      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      # apps/web is a git submodule (ChandanSurya96/nexarch-web). checkout
      # does not fetch submodules by default, so without this the directory
      # is empty and every step below fails — the first failure being
      # setup-node's cache lookup, with the fairly opaque "Some specified
      # paths were not resolved". The submodule repo is public, so the
      # default GITHUB_TOKEN is enough; making it private would require a
      # PAT in `token:` here.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run type-check

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
